name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: [10, 11, 12, 13]
        exclude:
          - laravel: 11
            php: '8.1'
          - laravel: 12
            php: '8.1'
          - laravel: 13
            php: '8.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: ${{ matrix.php == '8.4' && matrix.laravel == 13 && 'pcov' || 'none' }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Pin Laravel and Testbench versions
        run: |
          case "${{ matrix.laravel }}" in
            10) TESTBENCH="8.*" ;;
            11) TESTBENCH="9.*" ;;
            12) TESTBENCH="10.*" ;;
            13) TESTBENCH="11.*" ;;
          esac
          composer require \
            "laravel/framework:${{ matrix.laravel }}.*" \
            "orchestra/testbench:${TESTBENCH}" \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction

      - name: Run tests (with coverage)
        if: matrix.php == '8.4' && matrix.laravel == 13
        run: vendor/bin/phpunit --coverage-text

      - name: Run tests
        if: ${{ !(matrix.php == '8.4' && matrix.laravel == 13) }}
        run: vendor/bin/phpunit
